<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Project Shario</title>
    <style>
        /* Keep global body full-width so pages can include full-bleed sections
           Individual page content will be centered inside .wrapper */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #232325;
            margin: 0;
            padding: 0;
            background: #fff;
        }

        /* Content wrapper constrains the readable column for most pages */
        .wrapper {
            max-width: 750px;
            margin: 0 auto;
            padding: 0 24px;
            box-sizing: border-box;
        }

        /* Top Navigation Header */
        .site-header {
            padding: 20px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e5ea;
        }
        .back-link {
            color: #0066cc;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }

        h1, h2, h3, strong { color: #1d1d1f; font-weight: 700; }
        h1 { font-size: 32px; text-align: center; margin-top: 10px; margin-bottom: 10px; }
        p { color: #424245; font-size: 16px; margin-bottom: 20px; }
        ul { padding-left: 20px; margin-bottom: 20px; }
        li { margin-bottom: 8px; color: #424245; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        hr { border: 0; border-top: 1px solid #d2d2d7; margin: 40px 0; }
        
        /* Modern Button */
        .contact-container { text-align: center; margin: 30px 0; }
        .contact-btn {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .contact-btn:hover { background-color: #0077ed; color: white; text-decoration: none; }

        /* Two Apps Layout Grid */
        .legal-container {
            display: flex;
            justify-content: space-around;
            gap: 30px;
            margin-top: 30px;
        }
        .app-column { flex: 1; text-align: center; }
        .footer-links { list-style: none; padding: 0; }
        .footer-links li { margin-bottom: 10px; }
        
        /* Simple Footer */
        .site-footer { font-size: 13px; color: #86868b; text-align: center; margin-top: 60px; padding-bottom: 40px; }

        /* Allow full-bleed elements to escape wrapper using 100vw trick used in index.html */
        .full-bleed { width: 100vw; position: relative; left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw; }
    </style>
</head>
<body>

    <div class="wrapper">

    <!-- Header containing navigation back home -->
    {% if page.url != '/' and page.url != '/index.html' %}
    <header class="site-header">
        <a href="/" class="back-link">↖ Back to Home</a>
    </header>
    {% endif %}

    {{ content }}

    <div class="site-footer">
        &copy; {{ 'now' | date: "%Y" }} Project Shario. All rights reserved.
    </div>

    </div>

</body>
</html>
